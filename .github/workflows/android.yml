name: Build Water Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure persistent debug signing key
        env:
          KEYSTORE_B64: ${{ secrets.WATERTRACKER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WATERTRACKER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WATERTRACKER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WATERTRACKER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p app/signing
            printf '%s' "$KEYSTORE_B64" | base64 --decode > app/signing/watertracker-debug.keystore
            echo "WATERTRACKER_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/signing/watertracker-debug.keystore" >> "$GITHUB_ENV"
            echo "WATERTRACKER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "WATERTRACKER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "WATERTRACKER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Persistent signing key not configured; using temporary CI debug key."
          fi
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaterTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish verified APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: watertracker-build-${{ github.run_number }}
          name: Water Tracker verified build ${{ github.run_number }}
          body: |
            App-Version-Code: 27

            - Fix update check fallback so manually installed APK versions are verified before offering updates.
            - Add Transparent Glass Effect theme option.
            - Change glass-theme text outline/halo to soft translucent white instead of black.
            - Show yearly hydration totals as circular progress indicators.
            - Improve Records tab size and label wrapping.
            - Center a single yearly progress indicator in Daily Hydration.
            - Verify in-app APK package, version and signing certificate before installation.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
